<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Colors: blue, light blue, white, gray -->
  <defs>
    <style>
      .bg { fill:#ffffff; }
      .cal-fill { fill:#2B7AFA; }     /* header bar */
      .cal-paper { fill:#ffffff; stroke:#2B7AFA; stroke-width:6; }
      .cloud { fill:#4A5568; }
      .bar { fill:#FFD166; }          /* small bars (archive data) */
    </style>
  </defs>

  <!-- Calendar paper -->
  <rect x="20" y="28" rx="16" ry="16" width="172" height="200" class="cal-paper"/>
  <!-- Top header of calendar -->
  <rect x="20" y="28" rx="12" ry="12" width="172" height="44" class="cal-fill"/>
  <!-- Rings (calendar holes) -->
  <circle cx="56" cy="50" r="6" fill="#fff"/>
  <circle cx="92" cy="50" r="6" fill="#fff"/>
  <circle cx="128" cy="50" r="6" fill="#fff"/>

  <!-- small bar-chart inside calendar (represents archived data) -->
  <g transform="translate(44,96)">
    <rect x="0" y="40" width="18" height="40" class="bar" rx="2"/>
    <rect x="30" y="20" width="18" height="60" class="bar" rx="2"/>
    <rect x="60" y="10" width="18" height="70" class="bar" rx="2"/>
    <rect x="90" y="28" width="18" height="52" class="bar" rx="2"/>
  </g>

  <!-- Cloud overlapping right-bottom -->
  <g transform="translate(124,120) scale(1.0)">
    <path class="cloud" d="M24 8c-6.6 0-12 5.4-12 12h-4c-4.4 0-8 3.6-8 8s3.6 8 8 8h36c6.6 0 12-5.4 12-12s-5.4-12-12-12c-1 0-2 .1-2.9.3C64.6 24.4 58.1 16 48 16c-5.2 0-9.8 2.3-13 6z" transform="translate(-6,-6)"/>
  </g>

  <!-- subtle drop shadow under calendar (very light) -->
  <ellipse cx="106" cy="238" rx="56" ry="8" fill="#000" opacity="0.05"/>
</svg>
