<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Arquivo de Previsões — Zambujeira do Mar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#2B7AFA">
    <style>
        :root { var(--bg-color): #f4f7f6; var(--card-bg): #ffffff; var(--text-color): #333333; var(--accent-color): #0070f3; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; text-align: center; font-size: 28px; }
        h2 { margin: 0 0 20px 0; font-size: 18px; color: #666; font-weight: 400; }
        .controls { margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px; align-items: center; background: #ffffff; padding: 20px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        .control-group { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        label { font-weight: 600; font-size: 14px; }
        input[type="date"] { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; width: 100%; box-sizing: border-box; }
        .tabs { display: flex; gap: 10px; width: 100%; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e4e7e6; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        .tab-btn.active { background: #0070f3; color: white; }
        .gallery { max-width: 100%; width: 1200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 10px; box-sizing: border-box; }
        .screenshot-card { background: #ffffff; padding: 12px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
        .screenshot-card:hover { transform: translateY(-4px); }
        .screenshot-time { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #0070f3; text-align: center; }
        .thumbnail-wrapper { width: 100%; height: 180px; overflow: hidden; border-radius: 6px; background: #eee; }
        .screenshot-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .status-message { padding: 40px; text-align: center; color: #888; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; overflow: auto; }
        .modal-content { max-width: 100%; max-height: 100vh; transition: transform 0.1s ease-out; transform-origin: center center; }
        .close-btn { position: fixed; top: 15px; right: 25px; color: #fff; font-size: 45px; cursor: pointer; z-index: 1002; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        
        /* Botão Eliminar */
        .delete-btn { position: fixed; bottom: 30px; background: #ff3b30; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 1001; }
        .delete-btn:hover { background: #e03126; }
    </style>
</head>
<body>
    <h1><img src="/icons/header_icon.svg" alt="Архів погоди" style="height:36px; vertical-align:middle; margin-right:8px;">Arquivo de Previsões</h1>
    <h2>Zambujeira do Mar</h2>
    <div class="controls">
        <div class="control-group">
            <label>Selecionar Data:</label>
            <input type="date" id="date-picker">
        </div>
        <div class="control-group">
            <label>Fonte de Dados:</label>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchSource('windguru')">Windguru</button>
                <button class="tab-btn" onclick="switchSource('ipma')">IPMA</button>
            </div>
        </div>
    </div>
    <div id="status" class="status-message">A carregar dados...</div>
    <div id="gallery" class="gallery"></div>
    
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <button id="delete-btn" class="delete-btn" onclick="deleteCurrentFile(event)">🗑 Eliminar</button>
        <img class="modal-content" id="full-image" onclick="event.stopPropagation()">
    </div>

    <script>
        const githubUser = 'Skreebl'; 
        const repoName = 'Windbot';
        const datePicker = document.getElementById('date-picker');
        const gallery = document.getElementById('gallery');
        const statusMessage = document.getElementById('status');
        const modal = document.getElementById('imageModal');
        const fullImg = document.getElementById('full-image');

        let currentSource = 'windguru';
        let windguruFiles = [];
        let ipmaFiles = [];
        
        let currentFilePath = '';
        let currentFileSha = '';

        datePicker.value = new Date().toISOString().split('T')[0];

        async function fetchAllFiles() {
            try {
                const resW = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/images`);
                if (resW.ok) windguruFiles = (await resW.json()).filter(f => f.name.endsWith('.png'));
                const resI = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/ipma`);
                if (resI.ok) ipmaFiles = (await resI.json()).filter(f => f.name.endsWith('.png'));
                statusMessage.textContent = "";
                renderScreenshots();
            } catch (e) { statusMessage.textContent = "Erro ao carregar arquivos."; }
        }

        function switchSource(source) {
            currentSource = source;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === source));
            renderScreenshots();
        }

        function renderScreenshots() {
            gallery.innerHTML = "";
            const files = (currentSource === 'windguru') ? windguruFiles : ipmaFiles;
            const filtered = files.filter(f => f.name.startsWith(datePicker.value));
            if (filtered.length === 0) { statusMessage.textContent = "Sem registos para hoje."; return; }
            statusMessage.textContent = "";
            filtered.sort((a,b) => b.name.localeCompare(a.name)).forEach(f => {
                const time = f.name.split('_')[1].replace('.png', '').replace('-', ':');
                const card = document.createElement('div');
                card.className = 'screenshot-card';
                card.onclick = () => openModal(f.path, f.sha);
                card.innerHTML = `<div class="screenshot-time">⏱ ${time}</div><div class="thumbnail-wrapper"><img src="${f.path}"></div>`;
                gallery.appendChild(card);
            });
        }

        function openModal(imageSrc, imageSha) {
            currentFilePath = imageSrc;
            currentFileSha = imageSha;
            modal.style.display = "flex";
            fullImg.src = imageSrc;
            document.body.style.overflow = "hidden";
            
            if (window.location.hash !== '#preview') {
                history.pushState({modalOpen: true}, '', '#preview');
            }
        }

        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
            
            const viewport = document.querySelector('meta[name="viewport"]');
            if (viewport) {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                setTimeout(() => {
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes');
                }, 300);
            }

            if (window.location.hash === '#preview') {
                history.back();
            }
        }

        // ФУНКЦІЯ ВИДАЛЕННЯ ФАЙЛУ
        async function deleteCurrentFile(event) {
            event.stopPropagation(); // Щоб модалка не закрилась завчасно
            
            let token = localStorage.getItem('gh_token');
            if (!token) {
                token = prompt("Insira o seu GitHub Personal Access Token (PAT):");
                if (!token) return;
                localStorage.setItem('gh_token', token);
            }

            if (!confirm("Tem a certeza que deseja eliminar esta captura de ecrã?")) return;

            try {
                statusMessage.textContent = "A eliminar ficheiro...";
                const response = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/${currentFilePath}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete screenshot ${currentFilePath} via web panel`,
                        sha: currentFileSha
                    })
                });

                if (response.ok) {
                    alert("Captura eliminada com sucesso!");
                    closeModal();
                    fetchAllFiles(); // Перезавантажуємо галерею
                } else {
                    const errData = await response.json();
                    alert("Erro al eliminar: " + (errData.message || response.statusText));
                    localStorage.removeItem('gh_token'); // Скидаємо токен, якщо він не підійшов
                    statusMessage.textContent = "";
                }
            } catch (error) {
                alert("Erro na rede ao tentar eliminar.");
                statusMessage.textContent = "";
            }
        }

        window.addEventListener('popstate', function (event) {
            if (window.location.hash !== '#preview' && modal.style.display === "flex") {
                modal.style.display = "none";
                document.body.style.overflow = "auto";
            }
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        datePicker.addEventListener('change', renderScreenshots);
        fetchAllFiles();
    </script>
</body>
</html>
