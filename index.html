<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquivo de Previsões — Zambujeira do Mar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2B7AFA">
  <style>
    :root{
      --bg:#f4f7f6; --card:#fff; --muted:#666; --accent:#0070f3; --blue:#2B7AFA;
      --radius:12px; --shadow:0 6px 18px rgba(16,24,40,0.06);
      --gap:16px;
    }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0; background:var(--bg); color:#222}
    header{width:100%; padding:20px 24px; display:flex; align-items:center; gap:12px; justify-content:center}
    .brand{display:flex; align-items:center; gap:12px}
    .logo{width:44px;height:44px;flex:0 0 44px}
    h1{font-size:20px;margin:0}
    h2{font-size:13px;margin:0;color:var(--muted)}

    main{max-width:1100px;margin:18px auto;padding:0 16px}
    .controls{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
    .controls .left{display:flex;gap:12px;align-items:center}
    label{font-weight:600;font-size:13px;color:#333}
    input[type=date]{padding:8px 10px;border:1px solid #e6e9ee;border-radius:8px}
    .tabs{display:flex;gap:8px}
    .tab{padding:8px 12px;border-radius:8px;background:#eef3ff;color:var(--blue);font-weight:600;cursor:pointer;border:1px solid transparent}
    .tab.active{background:var(--blue);color:#fff}

    #status{padding:28px;text-align:center;color:var(--muted)}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:18px}
    .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
    .thumb{height:170px;background:#eee;display:block;width:100%;object-fit:cover}
    .meta{padding:10px 12px;font-weight:700;color:var(--accent);text-align:center}

    /* modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);z-index:9999;padding:28px}
    .modal.open{display:flex}
    .modal img{max-width:90vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
    .modal .controls{position:fixed;right:28px;bottom:28px;background:transparent;box-shadow:none;padding:0}
    .btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
    .btn.danger{background:#ff3b30}

    footer{max-width:1100px;margin:28px auto;text-align:center;color:var(--muted);font-size:13px}

    @media (max-width:600px){.controls{flex-direction:column;align-items:stretch}.brand{justify-content:center}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <!-- simple inline logo: calendar + cloud -->
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="8" width="40" height="36" rx="6" fill="#fff" stroke="#2B7AFA" stroke-width="3"/>
        <rect x="4" y="8" width="40" height="10" rx="4" fill="#2B7AFA"/>
        <circle cx="12" cy="13" r="2" fill="#fff"/>
        <circle cx="20" cy="13" r="2" fill="#fff"/>
        <g transform="translate(36,26) scale(0.9)">
          <path d="M12 6c-3.3 0-6 2.7-6 6H6c-2.2 0-4 1.8-4 4s1.8 4 4 4h12c3.3 0 6-2.7 6-6s-2.7-6-6-6z" fill="#4A5568"/>
        </g>
      </svg>
      <div>
        <h1>Arquivo de Previsões</h1>
        <h2>Zambujeira do Mar — Arquivo de imagens meteorológicas</h2>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <div class="left">
        <label for="date">Data</label>
        <input id="date" type="date">
        <div class="tabs" role="tablist" aria-label="Fontes">
          <button class="tab active" data-source="images">Windguru</button>
          <button class="tab" data-source="ipma">IPMA</button>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button id="refresh" class="btn">Atualizar</button>
      </div>
    </div>

    <div id="status">A carregar dados do repositório...</div>
    <div id="gallery" class="gallery" aria-live="polite"></div>
  </main>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <img id="modal-img" alt="Pré-visualização">
    <div class="controls">
      <button id="deleteBtn" class="btn danger">Eliminar</button>
    </div>
  </div>

  <footer>Feito com ❤️ — Dados hospedados neste repositório GitHub</footer>

  <script>
    const githubUser = 'Skreebl';
    const repo = 'Windbot';

    const dateInput = document.getElementById('date');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const tabs = document.querySelectorAll('.tab');
    const refreshBtn = document.getElementById('refresh');

    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const deleteBtn = document.getElementById('deleteBtn');

    let currentSource = 'images';
    let currentFile = null; // {path, sha, download_url}
    let filesCache = {images:[], ipma:[]};

    // initialize date to today
    dateInput.value = new Date().toISOString().slice(0,10);

    tabs.forEach(t => t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      currentSource = t.dataset.source;
      render();
    }));

    refreshBtn.addEventListener('click', fetchAll);

    async function fetchAll(){
      status.textContent = 'A carregar...';
      gallery.innerHTML = '';
      try{
        const [imgRes, ipmaRes] = await Promise.all([
          fetch(`https://api.github.com/repos/${githubUser}/${repo}/contents/images`),
          fetch(`https://api.github.com/repos/${githubUser}/${repo}/contents/ipma`)
        ]);

        if(imgRes.ok){
          const js = await imgRes.json();
          filesCache.images = js.filter(f => f.name.endsWith('.png') || f.name.endsWith('.jpg'));
        } else { filesCache.images = []; }

        if(ipmaRes.ok){
          const js2 = await ipmaRes.json();
          filesCache.ipma = js2.filter(f => f.name.endsWith('.png') || f.name.endsWith('.jpg'));
        } else { filesCache.ipma = []; }

        status.textContent = '';
        render();
      }catch(e){
        console.error(e);
        status.textContent = 'Erro ao carregar arquivos. Verifique a ligação ou limites da API.';
      }
    }

    function render(){
      gallery.innerHTML = '';
      const list = currentSource === 'images' ? filesCache.images : filesCache.ipma;
      const datePrefix = dateInput.value || '';
      const filtered = list.filter(f => f.name.startsWith(datePrefix));
      if(!filtered.length){
        status.textContent = 'Sem registos para a data selecionada.';
        return;
      }
      status.textContent = '';

      // sort descending by name (time)
      filtered.sort((a,b)=> b.name.localeCompare(a.name));

      for(const f of filtered){
        const t = (f.name.split('_')[1]||'').replace('.png','').replace('.jpg','').replace('-',':');
        const card = document.createElement('div'); card.className='card';
        const img = document.createElement('img'); img.className='thumb';
        // prefer download_url if available (from API), fallback to raw path
        img.src = f.download_url || `/${f.path}`;
        img.alt = f.name;
        img.loading = 'lazy';
        const meta = document.createElement('div'); meta.className='meta'; meta.textContent = t ? `⏱ ${t}` : f.name;
        card.appendChild(img); card.appendChild(meta);
        card.addEventListener('click', ()=> openModal(f));
        gallery.appendChild(card);
      }
    }

    function openModal(file){
      currentFile = file;
      modalImg.src = file.download_url || `/${file.path}`;
      modal.classList.add('open');
    }

    function closeModal(e){
      if(e && e.target !== modal) return; // click inside image shouldn't close
      modal.classList.remove('open');
      currentFile = null;
    }

    // delete logic uses GitHub API and a user PAT stored in localStorage (keeps token client-side only)
    deleteBtn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      if(!currentFile) return alert('Nenhum ficheiro selecionado');
      if(!confirm('Tem certeza que deseja eliminar este ficheiro do repositório?')) return;
      let token = localStorage.getItem('gh_token');
      if(!token) { token = prompt('Insira o seu GitHub Personal Access Token (com permissões repo)'); if(!token) return; localStorage.setItem('gh_token', token); }

      try{
        deleteBtn.disabled = true; deleteBtn.textContent = 'Eliminando...';
        const resp = await fetch(`https://api.github.com/repos/${githubUser}/${repo}/contents/${currentFile.path}`,{
          method:'DELETE',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type':'application/json' },
          body: JSON.stringify({ message:`Delete ${currentFile.path} via web UI`, sha: currentFile.sha })
        });
        const js = await resp.json();
        if(resp.ok){
          alert('Ficheiro eliminado'); closeModal(); fetchAll();
        } else {
          alert('Erro: ' + (js.message || resp.statusText));
          if(resp.status===401 || resp.status===403) localStorage.removeItem('gh_token');
        }
      }catch(e){ console.error(e); alert('Erro de rede ao tentar eliminar.'); }
      finally{ deleteBtn.disabled=false; deleteBtn.textContent='Eliminar'; }
    });

    // update when date changes
    dateInput.addEventListener('change', render);

    // initial load
    fetchAll();
  </script>
</body>
</html>
