<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Arquivo de Previsões — Zambujeira do Mar</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333333; --accent-color: #0070f3; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333333; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
        .header-icon { width: 36px; height: 36px; }
        h1 { margin: 0; text-align: center; font-size: 28px; }
        h2 { margin: 5px 0 20px 0; font-size: 18px; color: #666; font-weight: 400; text-align: center; }
        
        .controls { margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        .control-group { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        label { font-weight: 600; font-size: 14px; }
        input[type="date"] { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; width: 100%; box-sizing: border-box; }
        .tabs { display: flex; gap: 10px; width: 100%; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e4e7e6; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        .tab-btn.active { background: #0070f3; color: white; }
        
        .preview-container { display: none; flex-direction: column; width: 100%; max-width: 1200px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; margin-top: 10px; }
        .image-scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; background: #fdfdfd; border-bottom: 1px solid #eee; }
        .preview-image { width: max-content; min-width: 100%; max-width: none; display: block; cursor: pointer; image-rendering: crisp-edges; }
        
        .action-bar { display: flex; justify-content: flex-end; width: 100%; padding: 12px 15px; box-sizing: border-box; background: #ffffff; }
        .delete-btn { background: #ff3b30; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; }
        .delete-btn:hover { background: #e03126; }
        
        .status-message { padding: 40px; text-align: center; color: #888; font-size: 16px; }

        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; overflow: auto; }
        .modal-content { max-width: 100%; max-height: 100vh; }
        .close-btn { position: fixed; top: 15px; right: 25px; color: #fff; font-size: 45px; cursor: pointer; z-index: 1002; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); border-radius: 50%; }
    </style>
</head>
<body>
    
    <div class="header-container">
        <img src="icons/header_icon.svg" alt="Weather Logo" class="header-icon">
        <h1>Arquivo de Previsões</h1>
    </div>
    <h2>Zambujeira do Mar</h2>

    <div class="controls">
        <div class="control-group">
            <label>Selecionar Data:</label>
            <input type="date" id="date-picker">
        </div>
        <div class="control-group">
            <label>Fonte de Dados:</label>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchSource('windguru')">Windguru</button>
                <button class="tab-btn" onclick="switchSource('ipma')">IPMA</button>
            </div>
        </div>
    </div>

    <div id="status" class="status-message">A carregar dados...</div>

    <div id="preview-container" class="preview-container">
        <div class="image-scroll-wrapper">
            <img id="preview-image" class="preview-image" alt="Previsão do tempo" onclick="openModal()">
        </div>
        <div class="action-bar">
            <button class="delete-btn" onclick="deleteCurrentFile(event)">🗑 Eliminar</button>
        </div>
    </div>
    
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="full-image" onclick="event.stopPropagation()">
    </div>

    <script>
        const githubUser = 'Skreebl'; 
        const repoName = 'Windbot';
        
        const datePicker = document.getElementById('date-picker');
        const statusMessage = document.getElementById('status');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const modal = document.getElementById('imageModal');
        const fullImg = document.getElementById('full-image');

        let currentSource = 'windguru';
        let windguruFiles = [];
        let ipmaFiles = [];
        
        let currentFilePath = '';
        let currentFileSha = '';

        datePicker.value = new Date().toISOString().split('T')[0];

        async function fetchAllFiles() {
            try {
                const resW = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/images`);
                if (resW.ok) windguruFiles = (await resW.json()).filter(f => f.name.endsWith('.png'));
                const resI = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/ipma`);
                if (resI.ok) ipmaFiles = (await resI.json()).filter(f => f.name.endsWith('.png'));
                statusMessage.textContent = "";
                renderScreenshot();
            } catch (e) { statusMessage.textContent = "Erro ao carregar arquivos."; }
        }

        function switchSource(source) {
            currentSource = source;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === source));
            renderScreenshot();
        }

        function renderScreenshot() {
            previewContainer.style.display = "none";
            const files = (currentSource === 'windguru') ? windguruFiles : ipmaFiles;
            
            const filtered = files.filter(f => f.name.startsWith(datePicker.value));
            
            if (filtered.length === 0) {
                statusMessage.textContent = "Sem registos para este dia. 🤷‍♂️";
                return;
            }
            
            statusMessage.textContent = "";
            
            // Сортуємо список, щоб найновіший файл був першим
            filtered.sort((a, b) => b.name.localeCompare(a.name));
            
            const currentFile = filtered[0];
            currentFilePath = currentFile.path;
            currentFileSha = currentFile.sha;
            
            previewImage.src = currentFile.path;
            fullImg.src = currentFile.path;
            
            previewContainer.style.display = "flex";
        }

        function openModal() {
            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
            if (window.location.hash !== '#preview') {
                history.pushState({modalOpen: true}, '', '#preview');
            }
        }

        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
            
            const viewport = document.querySelector('meta[name="viewport"]');
            if (viewport) {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                setTimeout(() => {
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes');
                }, 300);
            }

            if (window.location.hash === '#preview') {
                history.back();
            }
        }

        async function deleteCurrentFile(event) {
            event.stopPropagation(); 
            
            let token = localStorage.getItem('gh_token');
            if (!token) {
                token = prompt("Insira o seu GitHub Personal Access Token (PAT):");
                if (!token) return;
                localStorage.setItem('gh_token', token);
            }

            if (!confirm("Tem a certeza que deseja eliminar esta captura de ecrã?")) return;

            try {
                statusMessage.textContent = "A eliminar ficheiro...";
                previewContainer.style.display = "none";
                
                const response = await fetch(`https://api.github.com/repos/${githubUser}/${repoName}/contents/${currentFilePath}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete screenshot ${currentFilePath} via web panel`,
                        sha: currentFileSha
                    })
                });

                if (response.ok) {
                    alert("Captura eliminada com sucesso!");
                    fetchAllFiles(); 
                } else {
                    const errData = await response.json();
                    alert("Erro ao eliminar: " + (errData.message || response.statusText));
                    localStorage.removeItem('gh_token'); 
                    fetchAllFiles();
                }
            } catch (error) {
                alert("Erro na rede ao tentar eliminar.");
                fetchAllFiles();
            }
        }

        window.addEventListener('popstate', function (event) {
            if (window.location.hash !== '#preview' && modal.style.display === "flex") {
                modal.style.display = "none";
                document.body.style.overflow = "auto";
            }
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        datePicker.addEventListener('change', renderScreenshot);
        fetchAllFiles();
    </script>
</body>
</html>
