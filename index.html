<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архів погоди Windguru — Галерея</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0070f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        label {
            font-weight: 600;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        /* Сітка для мініатюр */
        .gallery {
            max-width: 100%;
            width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        .screenshot-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .screenshot-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .screenshot-time {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-color);
            text-align: center;
        }
        /* Обмежуємо розмір мініатюри */
        .thumbnail-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 6px;
            position: relative;
            background: #eee;
        }
        .screenshot-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Обрізає картинку під прямокутник прев'ю */
            object-position: top; /* Показує саме верхню частину сайту в прев'ю */
        }
        .status-message {
            padding: 40px;
            text-align: center;
            color: #888;
            font-size: 18px;
        }

        /* Стилі для повноекранного модального вікна */
        .modal {
            display: none; /* Сховано за замовчуванням */
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow-y: auto;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 10px;
            box-sizing: border-box;
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 95%;
            width: 1280px; /* Реальна ширина скріншоту */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255,255,255,0.2);
        }
        .close-btn {
            position: fixed;
            top: 15px;
            right: 25px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <h1>Архів прогнозів Windguru 🌊</h1>

    <div class="controls">
        <label for="date-picker">Обери дату для перегляду:</label>
        <input type="date" id="date-picker">
    </div>

    <div id="status" class="status-message">Завантаження списку скріншотів...</div>
    <div id="gallery" class="gallery"></div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="full-image">
    </div>

    <script>
        // НАЛАШТУВАННЯ: Обов'язково впиши свій нік та назву репозиторію
        const githubUser = 'ТВІЙ_GITHUB_НІКНЕЙМ'; 
        const repoName = 'Windbot';
        const folderName = 'images'; 

        const datePicker = document.getElementById('date-picker');
        const gallery = document.getElementById('gallery');
        const statusMessage = document.getElementById('status');
        const modal = document.getElementById('imageModal');
        const fullImg = document.getElementById('full-image');

        let allFiles = [];

        // Встановлюємо сьогоднішню дату
        const today = new Date().toISOString().split('T')[0];
        datePicker.value = today;

        // Крок 1: Беремо список файлів з GitHub
        async function fetchFilesList() {
            const url = `https://api.github.com/repos/${githubUser}/${repoName}/contents/${folderName}`;
            try {
                statusMessage.textContent = "Зчитуємо архів з GitHub...";
                const response = await fetch(url);
                if (!response.ok) throw new Error('Помилка API');
                
                const data = await response.json();
                allFiles = data.filter(file => file.name.endsWith('.png'));
                
                statusMessage.textContent = "";
                renderScreenshots();
            } catch (error) {
                statusMessage.textContent = "Помилка завантаження архіву. Перевірте налаштування.";
                console.error(error);
            }
        }

        // Крок 2: Виводимо мініатюри
        function renderScreenshots() {
            gallery.innerHTML = "";
            const selectedDate = datePicker.value;

            if (!selectedDate) return;

            const filteredFiles = allFiles.filter(file => file.name.startsWith(selectedDate + '_'));

            if (filteredFiles.length === 0) {
                statusMessage.textContent = "За цей день немає збережених скріншотів 🤷‍♂️";
                return;
            }

            statusMessage.textContent = "";
            filteredFiles.sort((a, b) => a.name.localeCompare(b.name));

            filteredFiles.forEach(file => {
                const timePart = file.name.split('_')[1].replace('.png', '').replace('-', ':');

                const card = document.createElement('div');
                card.className = 'screenshot-card';
                // При кліку на картку відкриваємо модалку
                card.onclick = () => openModal(file.path);

                card.innerHTML = `
                    <div class="screenshot-time">⏱ Скріншот о ${timePart}</div>
                    <div class="thumbnail-wrapper">
                        <img src="${file.path}" alt="Прогноз погоди">
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Функції для модального вікна (Повний екран)
        function openModal(imageSrc) {
            modal.style.display = "flex";
            fullImg.src = imageSrc;
            document.body.style.overflow = "hidden"; // Забороняємо гортати задній фон
        }

        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto"; // Повертаємо прокрутку сторінки
        }

        // Закриття по кнопці Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        datePicker.addEventListener('change', renderScreenshots);
        fetchFilesList();
    </script>
</body>
</html>
