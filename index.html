<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архів погоди Windguru — Динамічний</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0070f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        label {
            font-weight: 600;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .gallery {
            max-width: 100%;
            width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .screenshot-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .screenshot-time {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent-color);
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 6px;
        }
        .screenshot-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .status-message {
            padding: 40px;
            text-align: center;
            color: #888;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Архів прогнозів Windguru 🌊</h1>

    <div class="controls">
        <label for="date-picker">Обери дату для перегляду:</label>
        <input type="date" id="date-picker">
    </div>

    <div id="status" class="status-message">Завантаження списку скріншотів...</div>
    <div id="gallery" class="gallery"></div>

    <script>
        // НАЛАШТУВАННЯ: впиши сюди свій нік на GitHub та назву репозиторію
        const githubUser = 'Skreebl'; 
        const repoName = 'Windbot';
        const folderName = 'images'; 

        const datePicker = document.getElementById('date-picker');
        const gallery = document.getElementById('gallery');
        const statusMessage = document.getElementById('status');

        let allFiles = [];

        // Встановлюємо сьогоднішню дату за замовчуванням
        const today = new Date().toISOString().split('T')[0];
        datePicker.value = today;

        // Крок 1: Запитуємо у GitHub API повний список файлів у папці images
        async function fetchFilesList() {
            const url = `https://api.github.com/repos/${githubUser}/${repoName}/contents/${folderName}`;
            try {
                statusMessage.textContent = "Зчитуємо архів з GitHub...";
                const response = await fetch(url);
                if (!response.ok) throw new Error('Не вдалося отримати дані');
                
                const data = await response.ok ? await response.json() : [];
                // Фільтруємо тільки .png файли
                allFiles = data.filter(file => file.name.endsWith('.png'));
                
                statusMessage.textContent = "";
                renderScreenshots(); // Відображаємо скріншоти для поточної дати
            } catch (error) {
                statusMessage.textContent = "Помилка завантаження архіву. Перевірте налаштування репозиторію.";
                console.error(error);
            }
        }

        // Крок 2: Фільтруємо файли за обраною датою та виводимо на екран
        function renderScreenshots() {
            gallery.innerHTML = ""; // Очищаємо галерею
            const selectedDate = datePicker.value; // Формат: YYYY-MM-DD

            if (!selectedDate) return;

            // Шукаємо файли, які починаються з обраної дати (наприклад: 2026-06-13_)
            const filteredFiles = allFiles.filter(file => file.name.startsWith(selectedDate + '_'));

            if (filteredFiles.length === 0) {
                statusMessage.textContent = "За цей день немає збережених скріншотів 🤷‍♂️";
                return;
            }

            statusMessage.textContent = "";

            // Сортуємо файли по часу (від раніших до пізніших)
            filteredFiles.sort((a, b) => a.name.localeCompare(b.name));

            // Генеруємо картки для кожного знайденого скріншоту
            filteredFiles.forEach(file => {
                // Витягуємо час з імені файлу (наприклад, з "2026-06-13_15-45.png" беремо "15:45")
                const timePart = file.name.split('_')[1].replace('.png', '').replace('-', ':');

                const card = document.createElement('div');
                card.className = 'screenshot-card';

                card.innerHTML = `
                    <div class="screenshot-time">⏱ Скріншот зроблено о ${timePart}</div>
                    <img src="${file.path}" alt="Прогноз погоди на ${timePart}">
                `;
                gallery.appendChild(card);
            });
        }

        // Слідкуємо за зміною дати
        datePicker.addEventListener('change', renderScreenshots);

        // Запуск процесу
        fetchFilesList();
    </script>
</body>
</html>
