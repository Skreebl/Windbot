<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архів погоди Windguru — Zambujeira do Mar</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0070f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        label {
            font-weight: 600;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }
        .image-container {
            max-width: 100%;
            width: 1280px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: none;
        }
        .image-container img.visible {
            display: block;
        }
        .no-data {
            padding: 40px;
            text-align: center;
            color: #888;
            font-size: 18px;
            display: none;
        }
        .no-data.visible {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Архів прогнозів Windguru 🌊</h1>

    <div class="controls">
        <label for="date-picker">Обери дату:</label>
        <input type="date" id="date-picker">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="changeTime('04-30')">Ранок (04:30)</button>
            <button class="tab-btn" onclick="changeTime('11-50')">День (11:50)</button>
        </div>
    </div>

    <div class="image-container">
        <img id="weather-screenshot" src="" alt="Прогноз погоди">
        <div id="error-message" class="no-data">Немає збереженого скріншоту за цей час 🤷‍♂️</div>
    </div>

    <script>
        // Конфігурація: вкажи назву папки, якщо міняв її в Make.com
        const folderName = 'images'; 
        
        let selectedTime = '04-30'; // Час за замовчуванням
        const datePicker = document.getElementById('date-picker');
        const imgElement = document.getElementById('weather-screenshot');
        const errorElement = document.getElementById('error-message');

        // Встановлюємо сьогоднішню дату в календар при завантаженні сторінки
        const today = new Date().toISOString().split('T')[0];
        datePicker.value = today;

        // Функція для оновлення скріншоту на екрані
        function updateScreenshot() {
            const date = datePicker.value; // Формат YYYY-MM-DD
            if (!date) return;

            // Збираємо шлях до файлу, який згенерував Make.com (наприклад: images/2026-06-13_04-30.png)
            const imgUrl = `${folderName}/${date}_${selectedTime}.png`;

            // Скидаємо видимість перед завантаженням
            imgElement.classList.remove('visible');
            errorElement.classList.remove('visible');

            // Спроба завантажити картинку
            imgElement.src = imgUrl;
        }

        // Якщо картинка успішно знайшлась і завантажилась
        imgElement.onload = function() {
            imgElement.classList.add('visible');
        };

        // Якщо файлу для цієї дати/години немає в репозиторії
        imgElement.onerror = function() {
            imgElement.classList.remove('visible');
            errorElement.classList.add('visible');
        };

        // Перемикання між ранковим та денним скріншотом
        function changeTime(time) {
            selectedTime = time;
            
            // Перемикаємо активний клас на кнопках
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            updateScreenshot();
        }

        // Слідкуємо за зміною дати в календарі
        datePicker.addEventListener('change', updateScreenshot);

        // Перший запуск при завантаженні сторінки
        updateScreenshot();
    </script>
</body>
</html>
